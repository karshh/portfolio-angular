<h3>{{ title }}</h3>
<div class="mapShell">
  @if (status === 'loading') {
    <p class="mapMessage" role="status">Loading {{ title | lowercase }}…</p>
  }
  @if (status === 'error') {
    <div class="mapMessage" role="alert">
      <p>{{ title }} are temporarily unavailable.</p>
      <button type="button" class="btn btn-outline-light" (click)="retry()">Retry {{ title | lowercase }}</button>
    </div>
  }
  @if (status === 'empty') {
    <p class="mapMessage" role="status">No {{ title | lowercase }} to display.</p>
  }
  <div #mapContainer class="leafletMap" data-testid="leaflet-map" [attr.aria-label]="title + ' map'"></div>
</div>
